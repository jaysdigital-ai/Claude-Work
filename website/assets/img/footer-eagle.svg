<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110">
  <!-- Side-view eagle for the footer flight (facing right). The wings are
       separate groups so they can flap around the shoulder. -->
  <defs>
    <linearGradient id="fe-body" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="172" y2="0">
      <stop offset="0" stop-color="#7a5ce8"/>
      <stop offset=".55" stop-color="#7e9cf4"/>
      <stop offset="1" stop-color="#7cd3f2"/>
    </linearGradient>
    <linearGradient id="fe-wing" gradientUnits="userSpaceOnUse" x1="0" y1="68" x2="0" y2="4">
      <stop offset="0" stop-color="#86b4f6"/>
      <stop offset=".5" stop-color="#8d84f0"/>
      <stop offset="1" stop-color="#b98fff"/>
    </linearGradient>
    <linearGradient id="fe-wing-far" gradientUnits="userSpaceOnUse" x1="0" y1="66" x2="0" y2="18">
      <stop offset="0" stop-color="#3f4a9c"/>
      <stop offset="1" stop-color="#5a46aa"/>
    </linearGradient>
  </defs>
  <!-- far wing, behind the body -->
  <g class="fe-wing fe-wing--far">
    <path fill="url(#fe-wing-far)" d="M117 65 C110 50 97 33 76 18 C79 25 81 29 81 31 C74 26 66 24 60 24 C65 29 68 33 69 37 C63 35 57 35 51 37 C57 41 61 44 62 47 C56 47 51 48 47 50 C54 54 59 57 61 60 C69 64 82 65 93 66 C104 67 112 67 117 65 Z"/>
  </g>
  <!-- tail -->
  <path fill="url(#fe-body)" d="M64 75 L34 70 L38 76 L31 79 L38 82 L34 88 L64 81 Z"/>
  <!-- body -->
  <path fill="url(#fe-body)" d="M60 76 C76 62 104 58 128 60 C138 61 146 58 152 56 C157 54 162 55 164 58 L168 62 L162 64 C156 67 148 70 140 73 C126 80 108 86 90 85 C76 84 66 81 60 76 Z"/>
  <!-- head, beak, eye -->
  <path fill="#eaf7ff" d="M142 62 C143 52 154 49 161 53 C165 56 166 60 164 63 C158 67 149 68 142 65 Z"/>
  <path fill="#e2c79a" d="M160 54 C167 53 172 57 172 62 C171 65 169 67 166 69 C166 66 164 63 160 62 Z"/>
  <circle cx="155.5" cy="56.5" r="1.8" fill="#141238"/>
  <!-- near wing, in front of the body -->
  <g class="fe-wing fe-wing--near">
    <path fill="url(#fe-wing)" d="M110 66 C102 46 86 24 58 4 C62 12 64 17 64 20 C55 13 47 11 39 11 C46 18 50 23 51 27 C43 24 35 24 28 26 C36 31 41 36 42 39 C35 38 29 40 23 43 C31 47 38 50 40 54 C48 60 64 64 78 66 C92 68 103 68 110 66 Z"/>
    <path fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1" stroke-linecap="round" d="M105 62 C95 45 81 29 63 15 M96 64 C85 52 71 40 50 30"/>
  </g>
</svg>
